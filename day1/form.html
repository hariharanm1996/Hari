<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
<form>
  <label>Registration Form</label><br>
  <label>First Name :</label>
  <input type="text" placeholder="Enter First Name"><br>
  <label>Last Name :</label>
  <input type="text" placeholder="Enter Last Name"><br>
  <label>Email :</label>
  <input type="email" placeholder="Enter Email Address"><br>
  <label>Password :</label>
  <input type="password"><br>
  <label>Gender :</label><br>
  <input type="radio" name="g">Male<br>
  <input type="radio" name="g">Female<br>
  <input type="radio" name="g">Other<br>
  <label>Age :</label>
  <input type="number"><br>
  <label>Preferences :</label><br>
  <input type="checkbox">Acrylic Painting<br>
  <input type="checkbox">Oil Painting<br>
  <input type="checkbox">Water Color Painting<br>
  <label>Select Occupation :</label>
  <select>
    <option>Student</option>
    <option>Employee</option>
    <option>Business</option>
  </select><br>
  <label>Bio</label><br>
  <textarea rows="10" cols="50" placeholder="Share few lines about yourself..."></textarea><br>
  <input type="reset" value="RESET">
  <input type="submit" value="SUBMIT">
</form>
</body>
</html>
